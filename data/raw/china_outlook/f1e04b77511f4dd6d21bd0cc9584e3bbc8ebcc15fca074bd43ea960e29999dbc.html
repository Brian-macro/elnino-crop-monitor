<script>
        document.addEventListener('DOMContentLoaded', function () {
            var page = window.location.pathname;
            if (page.startsWith('/2026/index')) {
                document.querySelector('#nav1').classList.add('nav-active');
            } else if (page.startsWith('/2026/introduction')) {
                document.querySelector('#nav2').classList.add('nav-active');
            } else if (page.startsWith('/2026/schedule')) {
                document.querySelector('#nav3').classList.add('nav-active');
            } else if (page.startsWith('/2026/notice')) {
                document.querySelector('#nav5').classList.add('nav-active');
            } else if (page.startsWith('/2026/live')) {
                document.querySelector('#nav6').classList.add('nav-active');
            } else if (page.startsWith('/review')) {
                document.querySelector('#nav7').classList.add('nav-active');
            } else if (page.startsWith('/2026/accommodation_transportation')) {
                document.querySelector('#nav8').classList.add('nav-active');
            } else if (page.startsWith('/2026/download')) {
                document.querySelector('#nav9').classList.add('nav-active');
            } else if (page.startsWith('/2026/video')) {
                document.querySelector('#nav10').classList.add('nav-active');
            } else if (page.startsWith('/2026/media')) {
                document.querySelector('#nav11').classList.add('nav-active');
            }

            const startsWithAny = (str, prefixes) => prefixes.some(p => str.startsWith(p));
            if (startsWithAny(page, [
                '/2026/index',
                '/2026/introduction',
                '/2026/schedule',
                '/review'
            ])) {
                document.querySelector('.language-bar').style.visibility = 'visible';

                const language_bar = document.querySelector('.language-bar');
                const cn_link = language_bar.querySelector('a.cn');
                const en_link = language_bar.querySelector('a.en');
                if (page.endsWith('_en/')) {
                    cn_link.href = page.replace(/_en\/$/, '/');
                    en_link.href = page;
                } else {
                    cn_link.href = page;
                    en_link.href = page.replace(/\/$/, '_en/');
                }

                var curr_lang;
                if (page.endsWith('_en/')) {
                    curr_lang = document.querySelector('.language-bar .en');
                } else {
                    curr_lang = document.querySelector('.language-bar .cn');
                }
                if (curr_lang) {
                    curr_lang.style.color = 'var(--main-color)';
                }
            }
        });
