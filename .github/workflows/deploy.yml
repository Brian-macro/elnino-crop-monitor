name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "config/**"
      - "scripts/**"
      # Forecast snapshots are deployed by update-data.yml through workflow_call
      # after its validation and Parquet export complete. Excluding those paths
      # prevents a second, competing Pages deployment on the bot's data commit.
      - "public/images/**"
      - "public/fonts/**"
      - "public/world.json"
      - "public/world.source.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.mjs"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build data with the committed research policy
        run: |
          pip install -r requirements.txt
          python scripts/build_database.py --db data/processed/monitor_v2.duckdb
          python scripts/update_all.py --group build

      - name: Run data and type regressions
        run: |
          python -m pytest -q
          npm run typecheck

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ !endsWith(github.event.repository.name, '.github.io') && format('/{0}', github.event.repository.name) || '' }}
        run: npm run build

      - name: Run browser and static API regressions
        run: |
          npx playwright install chromium
          # The production export uses the repository name as its base path.
          # Mirror that mount locally so browser tests load the same asset URLs
          # that GitHub Pages serves.
          mkdir -p .static-test/elnino-crop-monitor
          cp -a out/. .static-test/elnino-crop-monitor/
          python -m http.server 3000 --directory .static-test &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/elnino-crop-monitor/; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready:-}" = "1"
          TEST_URL=http://127.0.0.1:3000/elnino-crop-monitor npm run test:browser

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
